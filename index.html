<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diego Requena Portfolio</title>
<link rel="icon" type="image/png" href="img/avatar.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: menú de inicio de consola; barra de iconos redondos y reloj arriba, cuadrícula de juegos cuadrados, ficha blanca al abrir. */
:root{
  color-scheme: light;
  --bg:#ebebeb; --bg-hi:#f7f7f7; --tile:#f3f3f3; --white:#ffffff;
  --ink:#2f3134; --muted:#8b8e93; --line:#dedfe1;
  --sel:#14c0e8; --sel-soft:#9ee9fa;
  --surface-1:#f5f6f7; --surface-2:#efeff0; --surface-3:#f2f2f3; --surface-hover:#e4e5e7; --card:#ffffff;
  --edge:#e1e2e4; --hl:rgba(255,255,255,.9); --dot:#d3d4d7; --link:#0a8fb5; --overlay:rgba(235,235,235,.86);
  --warn:#8a6200; --warn-bg:#fff6dc;
  --f-display:'M PLUS Rounded 1c','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background:radial-gradient(1200px 700px at 50% 30%,var(--bg-hi),var(--bg) 75%) fixed;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:20px 36px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-hi)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sel);outline-offset:3px}
a{color:var(--link)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

/* barra superior */
.top{display:flex;align-items:center;gap:clamp(10px,2vw,22px);flex-wrap:wrap}
.me{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.avatar{flex:0 0 auto;width:58px;height:58px;border-radius:50%;display:block;object-fit:cover;background:#e97f45;
  box-shadow:0 0 0 4px var(--white),0 0 0 5px var(--line),0 6px 14px -6px rgba(0,0,0,.25);
  font:800 19px var(--f-display);color:var(--ink);letter-spacing:-.02em}
.me h1{margin:0;font:700 clamp(19px,2.4vw,24px)/1.1 var(--f-display)}
.me p{margin:2px 0 0;color:var(--muted);font-size:14px}
.icons{display:flex;gap:clamp(8px,1.6vw,16px)}
.ico{position:relative;width:54px;height:54px;border-radius:50%;border:0;padding:0;cursor:pointer;display:grid;place-items:center;
  background:var(--white);box-shadow:0 0 0 1px var(--line),0 4px 10px -6px rgba(0,0,0,.3);transition:transform .15s}
.ico svg{width:28px;height:28px}
a.ico{text-decoration:none;color:inherit}
.ico:hover,.ico:focus-visible{outline:none;box-shadow:0 0 0 3px var(--white),0 0 0 6px var(--sel)}
.ico:active{transform:scale(.94)}
.ico .tip{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;font:700 13px var(--f-display);
  color:var(--ink);opacity:0;pointer-events:none;transition:opacity .15s}
.ico:hover .tip,.ico:focus-visible .tip{opacity:1}
.ico[aria-pressed="false"] svg{opacity:.35}
.clock{font:400 clamp(22px,2.8vw,30px)/1 var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}

/* título seleccionado */
.now{min-height:64px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.now h2{margin:0;font:700 clamp(22px,3vw,30px)/1.15 var(--f-display);color:var(--ink)}
.now p{margin:0;color:var(--muted);font-size:15px}

/* cuadrícula */
.group{display:flex;flex-direction:column;gap:12px}
.group[hidden]{display:none}
/* separador entre secciones: línea discontinua que se desplaza lentamente */
.group ~ .group::before{content:"";display:block;height:2px;margin:6px 0 14px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--muted) 0 10px,transparent 10px 20px);background-size:20px 2px;opacity:.45;
  animation:dash-move 2.6s linear infinite}
@keyframes dash-move{to{background-position:20px 0}}

/* ---------- cintas VHS ---------- */
.vhs-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile.vhs-tile .frame{aspect-ratio:auto;padding:0;background:none;box-shadow:none;border-radius:10px}
.tile.vhs-tile .frame::after{border-radius:12px}
.vhs{position:relative;width:100%;aspect-ratio:178/100;border-radius:10px;container-type:inline-size;overflow:hidden;
  background:repeating-linear-gradient(180deg,#1e1f21 0 .45cqw,#161719 .45cqw .9cqw);
  box-shadow:inset 0 .3cqw 0 rgba(255,255,255,.08),inset 0 -.4cqw 0 rgba(0,0,0,.45),0 8px 16px -9px rgba(0,0,0,.55)}
.vhs-top{position:absolute;left:0;right:0;top:0;height:17%;
  background:repeating-linear-gradient(180deg,transparent 0 1.2cqw,rgba(0,0,0,.45) 1.2cqw 1.45cqw,rgba(255,255,255,.05) 1.45cqw 1.6cqw),linear-gradient(180deg,#2e3033,#242528);
  box-shadow:inset 0 -.35cqw 0 rgba(0,0,0,.6),0 .2cqw 0 rgba(255,255,255,.06)}
.vhs-top::after{content:"";position:absolute;left:50%;top:22%;width:3.2cqw;height:3.6cqw;margin-left:-1.6cqw;background:#121314;
  clip-path:polygon(50% 0,100% 55%,68% 55%,68% 100%,32% 100%,32% 55%,0 55%);filter:drop-shadow(0 .15cqw 0 rgba(255,255,255,.1))}
.vhs-win{position:absolute;top:34.5%;height:43%;width:10.5cqw;overflow:hidden;
  background:linear-gradient(160deg,#3a3d41,#202225 60%,#2a2c30);box-shadow:inset 0 0 0 .35cqw #0d0e0f,inset 0 .8cqw 1.6cqw rgba(0,0,0,.6)}
.vhs-win.l{left:3cqw;border-radius:5cqw .8cqw .8cqw 5cqw/9cqw .8cqw .8cqw 9cqw}
.vhs-win.r{right:3cqw;border-radius:.8cqw 5cqw 5cqw .8cqw/.8cqw 9cqw 9cqw .8cqw}
.vhs-win::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(125deg,rgba(255,255,255,.22) 0 18%,transparent 34% 62%,rgba(255,255,255,.08) 72%,transparent 85%)}
.reel{position:absolute;top:50%;width:19cqw;height:19cqw;margin-top:-9.5cqw;border-radius:50%}
.vhs-win.l .reel{left:1.5cqw;background:radial-gradient(circle,#0f1011 0 9%,#e9e9e7 10% 36%,#bdbdb9 37% 40%,#141414 41% 98%,transparent 99%)}
.vhs-win.r .reel{right:1.5cqw;background:radial-gradient(circle,#0f1011 0 9%,#e9e9e7 10% 36%,#bdbdb9 37% 40%,#141414 41% 50%,rgba(255,255,255,.06) 51% 98%,transparent 99%)}
.reel::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#2a2b2d 0 14deg,transparent 14deg 60deg);
  -webkit-mask:radial-gradient(circle,transparent 0 16%,#000 17% 34%,transparent 35%);mask:radial-gradient(circle,transparent 0 16%,#000 17% 34%,transparent 35%)}
.vhs-tile:hover .reel,.vhs-tile:focus-visible .reel,.vhs.playing .reel{animation:reel-spin 5s linear infinite}
.vhs.playing .reel{animation-duration:1s}
@keyframes reel-spin{to{transform:rotate(360deg)}}
.vhs-label{position:absolute;left:15cqw;top:21%;width:70cqw;aspect-ratio:16/9;border-radius:1cqw;background:#111 center/cover no-repeat;
  box-shadow:0 0 0 .35cqw #0d0e0f,0 .2cqw 0 .35cqw rgba(255,255,255,.07)}
.vhs-dur{position:absolute;right:1.2cqw;bottom:1.2cqw;padding:.5cqw 1cqw;border-radius:.7cqw;background:rgba(0,0,0,.78);color:#fff;font:700 3cqw/1 var(--f-display)}
.tile.vhs-tile .caption{white-space:normal}
.tile.vhs-tile .caption .vt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* reproductor tipo televisor */
.tv{position:fixed;inset:0;z-index:70;background:rgba(18,19,22,.9);display:flex;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.tv[hidden]{display:none}
.tv-box{width:min(980px,100%);display:flex;flex-direction:column;gap:14px}
.tv-screen{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000 center/cover no-repeat;box-shadow:0 0 0 6px #2a2b2f,0 30px 60px -20px rgba(0,0,0,.6)}
.tv-screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tv-screen .tv-open{position:absolute;inset:0;display:grid;place-items:center;text-decoration:none;color:#fff;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.tv-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;color:#fff}
.tv-bar strong{font:700 17px/1.3 var(--f-display);min-width:0}
.tv-bar div{display:flex;gap:8px}
.group-label{margin:0;font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:clamp(14px,2vw,24px)}
.tile{position:relative;border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.tile .frame{position:relative;aspect-ratio:1;width:100%;padding:9px;border-radius:14px;background:var(--tile);
  box-shadow:inset 0 2px 0 var(--hl),0 0 0 1px var(--edge),0 6px 14px -8px rgba(0,0,0,.28);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.tile .frame::after{content:"";position:absolute;inset:-7px;border-radius:19px;border:4px solid var(--sel);opacity:0;pointer-events:none}
.tile:hover .frame,.tile:focus-visible .frame,.tile.is-sel .frame{transform:translateY(-3px)}
.tile.is-sel .frame::after{opacity:1;animation:pulse 1.4s ease-in-out infinite}
/* inclinación 3D al pasar el ratón: el cuadro sale un poco y se inclina hacia donde está el puntero */
@media (hover:hover) and (pointer:fine){
  .tile .frame::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;opacity:0;transition:opacity .25s;
    background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.28),rgba(255,255,255,0) 55%);mix-blend-mode:soft-light}
  .tile.tilting .frame{transform:perspective(800px) translateY(-8px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg)) scale(1.035);
    transition:transform .14s ease-out,box-shadow .2s;box-shadow:inset 0 2px 0 var(--hl),0 0 0 1px var(--edge),0 22px 30px -18px rgba(0,0,0,.45)}
  .tile.vhs-tile.tilting .frame{box-shadow:0 22px 30px -18px rgba(0,0,0,.5)}
  .tile.tilting .frame::before{opacity:1}
  .tile.tilt-off .frame{transition:none}
}
.tile:focus-visible{outline:none}
@keyframes pulse{50%{border-color:var(--sel-soft)}}
.tile .caption{font:700 15px/1.25 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.tile .caption small.award-line{color:#9a7410;white-space:normal;font-size:12px;line-height:1.3;margin-top:2px}
.tile .caption small.award-line::before{content:"";display:inline-block;width:8px;height:10px;margin-right:5px;background:#d9ad2b;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.tile .caption small{display:block;font:600 13px var(--f-body);color:var(--muted)}
.tile.is-out .frame{visibility:hidden}

/* portada cuadrada */
.art{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background-size:cover;background-position:center;
  background-color:var(--b);display:grid;place-items:center;text-align:center}
.art.comp::before{content:"";position:absolute;inset:0;background:rgba(10,12,20,var(--shade,0))}
.art.comp .logo{position:relative;max-height:72%;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.art.comp .char{position:absolute;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.ribbons{position:absolute;left:6%;top:0;display:flex;gap:3cqw;align-items:flex-start;filter:drop-shadow(0 1cqw 1.6cqw rgba(0,0,0,.35));z-index:2}
.rib-img{width:17cqw;display:block}
.rib{width:17cqw;aspect-ratio:300/633;background:#fff;color:#1b1b1d;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);
  display:flex;flex-direction:column;align-items:center;padding:3cqw 1cqw 0;text-align:center;font-family:var(--f-display);line-height:1.05}
.rib svg{width:7cqw;height:7cqw;color:#1b1b1d}
.rib .stars{font-size:2.6cqw;letter-spacing:.3cqw;margin:.6cqw 0 1.2cqw}
.rib b{font-weight:800;font-size:2.9cqw;letter-spacing:.02em}
.rib i{display:block;width:60%;height:.3cqw;background:#c9cbcf;margin:1.3cqw 0}
.rib em{font-style:italic;font-weight:600;font-size:2.5cqw}
.rib small{font-weight:800;font-size:2.4cqw;margin-top:.4cqw}
.rib.win svg,.rib.win .stars{color:#b88a10}
.art.plain{background:linear-gradient(150deg,var(--a),var(--b))}
.art .t{padding:10%;font:800 clamp(18px,7cqw,40px)/1.05 var(--f-display);color:#fff;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.art-wrap{container-type:inline-size;width:100%;height:100%}

.hints{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 22px;margin:4px 0 0;color:var(--muted);font:600 13px var(--f-body);
  border-top:1px solid var(--line);padding-top:16px}
.hints kbd{font:700 11px var(--f-display);color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-right:4px}

/* caja 3D (estuche cuadrado) */
.stage{position:fixed;inset:0;z-index:40;perspective:1600px;pointer-events:none}
.fly{position:absolute;left:0;top:0;width:var(--w);height:var(--h);transform-style:preserve-3d;transform-origin:50% 50%}
.box{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;left:0;top:0;backface-visibility:hidden}
.f-lid{width:var(--w);height:var(--h);transform-origin:left center;transform-style:preserve-3d;transform:translateZ(calc(var(--d) / 2))}
.lid-front,.lid-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:calc(var(--w) * .082);overflow:hidden}
.lid-front{background:var(--tile);padding:calc(var(--w) * .053);box-shadow:inset 0 2px 0 var(--hl),0 0 0 1px var(--edge)}
.lid-back{transform:rotateY(180deg);background:#f2f3f4;container-type:size;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px var(--line),inset 0 0 0 7px #fafafa}
.lid-back::before,.lid-back::after{content:"";position:absolute;right:4%;width:4.5%;height:13%;border-radius:3px;background:#d4d6d9;box-shadow:inset 0 1px 0 #fff}
.lid-back::before{top:13%}
.lid-back::after{bottom:13%}
.manual{width:76%;height:84%;margin-right:7%;background:#fff;border-radius:2cqw;display:flex;flex-direction:column;gap:3.2cqw;padding:0 5cqw 5cqw;overflow:hidden;
  box-shadow:0 1cqw 3cqw rgba(0,0,0,.16),1.4cqw 1.4cqw 0 -.3cqw var(--edge),2.6cqw 2.6cqw 0 -.6cqw #dcdde0}
.m-head{display:flex;justify-content:space-between;align-items:center;margin:0 -5cqw;padding:3cqw 5cqw;background:var(--b);color:#fff;
  font:800 4.2cqw/1 var(--f-display);letter-spacing:.1em}
.m-pic{flex:1;min-height:0;border-radius:2cqw;background:var(--a) center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.m-title{font:800 6.6cqw/1.05 var(--f-display);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-row{display:flex;gap:4cqw;align-items:center}
.m-row svg{width:25cqw;flex:0 0 auto}
.m-lines{flex:1;display:flex;flex-direction:column;gap:2.2cqw}
.m-lines i{height:1.7cqw;border-radius:1cqw;background:#e2e3e5}
.m-lines i:nth-child(2){width:82%}
.m-lines i:nth-child(3){width:58%}
.m-foot{display:flex;justify-content:space-between;font:700 3.4cqw/1 var(--f-display);color:var(--muted)}
.f-inside{width:var(--w);height:var(--h);transform:translateZ(calc(var(--d) / 2 - 1px));border-radius:calc(var(--w) * .082);background:#f6f6f6;
  display:grid;place-items:center;align-content:center;gap:10px;box-shadow:inset 0 0 0 1px var(--line),inset 0 0 0 8px #fbfbfb}
/* disco: ilustración arriba, franja negra con datos y parte plateada irisada abajo */
.disc-wrap{width:86%;aspect-ratio:1;position:relative}
.disc{width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;container-type:inline-size;
  -webkit-mask:radial-gradient(circle closest-side at 50% 50%,transparent 0 38%,#000 38.4%);mask:radial-gradient(circle closest-side at 50% 50%,transparent 0 38%,#000 38.4%);
  background:
    conic-gradient(from 200deg at 50% 50%,rgba(255,170,210,.0),rgba(255,170,210,.5) 8%,rgba(170,225,255,.55) 14%,rgba(205,255,215,.45) 20%,rgba(255,240,170,.0) 28%,
      rgba(255,240,170,.0) 58%,rgba(255,230,160,.5) 66%,rgba(170,220,255,.5) 72%,rgba(220,180,255,.45) 78%,rgba(220,180,255,.0) 86%),
    conic-gradient(from 10deg,#c3c6ca,#eef0f2,#b5b9be,#e4e6e9,#c7cace,#f2f3f4,#c3c6ca);
  box-shadow:inset 0 0 0 1px #9da1a6}
.disc-wrap::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 1px #9da1a6,0 8px 18px -8px rgba(0,0,0,.35);
  -webkit-mask:radial-gradient(circle closest-side at 50% 50%,transparent 0 38%,#000 38.4%);mask:radial-gradient(circle closest-side at 50% 50%,transparent 0 38%,#000 38.4%)}
.disc.full{background:#d9dcdf}
/* reflejo irisado: se aplica solo a las zonas grises/plateadas (máscara calculada de la imagen) */
.d-iri{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;z-index:3;mix-blend-mode:overlay;opacity:.95;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.d-iri.auto{-webkit-mask-image:radial-gradient(circle closest-side,transparent 0 38%,#000 38.4% 41%,transparent 41.4% 96.4%,#000 96.8%),linear-gradient(transparent 80%,#000 80%);
  mask-image:radial-gradient(circle closest-side,transparent 0 38%,#000 38.4% 41%,transparent 41.4% 96.4%,#000 96.8%),linear-gradient(transparent 80%,#000 80%)}
.d-iri i{position:absolute;inset:-50%;background:conic-gradient(from 0deg,#ff5fc4,#ffcf5c,#7dffbf,#5cc8ff,#b07cff,#ff5fc4,#ffcf5c,#7dffbf,#5cc8ff,#b07cff,#ff5fc4);
  animation:iri-turn 5s linear infinite;filter:saturate(1.4)}
.d-iri b{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.95) 46%,rgba(255,255,255,0) 58%);background-size:260% 100%;
  animation:iri-shine 2.4s ease-in-out infinite}
@keyframes iri-turn{to{transform:rotate(360deg)}}
@keyframes iri-shine{0%{background-position:110% 0}100%{background-position:-70% 0}}
.insert-layer{position:fixed;inset:0;z-index:55;pointer-events:none}
.insert-disc{position:absolute;left:0;top:0}
.insert-disc .disc-wrap{width:100%}
.slot-line{position:absolute;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--sel),transparent);opacity:0;
  box-shadow:0 0 14px var(--sel)}
.d-rim{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;
  background:conic-gradient(from 10deg,#c3c6ca,#eef0f2,#b5b9be,#e4e6e9,#c7cace,#f2f3f4,#c3c6ca);
  -webkit-mask:radial-gradient(circle closest-side,transparent 0 38%,#000 38.4% 41%,transparent 41.4% 96.4%,#000 96.8%);
  mask:radial-gradient(circle closest-side,transparent 0 38%,#000 38.4% 41%,transparent 41.4% 96.4%,#000 96.8%)}
.d-full{position:absolute;inset:0;border-radius:50%;background:center/cover no-repeat}
.d-art{position:absolute;left:0;top:0;width:100%;height:69%;background:var(--b) center/cover no-repeat;background-image:var(--img,none)}
.d-art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 48%,transparent 60%)}

/* modo oscuro: gris carbón como los menús de Nintendo (nada de negro puro) */
:root[data-mode="dark"]{
  color-scheme: dark;
  --bg:#2b2c30; --bg-hi:#35373c; --tile:#3b3d42; --white:#33353a;

.crt{position:fixed;inset:0;z-index:2147483000;pointer-events:none;display:none}
:root.crt-on .crt{display:block}
.crt>i{position:absolute;inset:0;display:block}

.crt .glass{background:radial-gradient(60% 40% at 22% 10%,rgba(255,255,255,.07),transparent 70%)}
.crt .roll{inset:auto 0 auto 0;top:0;height:18vh;background:linear-gradient(180deg,transparent,rgba(255,255,255,.035) 50%,transparent);animation:crt-roll 9s linear infinite}

        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="now" aria-live="polite"><h2 id="sel-title">Elige un juego</h2><p id="sel-meta">Ábrelo para ver qué hice en él</p></div>

  <section class="group" aria-labelledby="g-games"><p class="group-label" id="g-games">Juegos</p><div class="grid" id="grid-game"></div></section>
  <section class="group" id="sec-art" aria-labelledby="g-art"><p class="group-label" id="g-art">Arte</p><div class="grid" id="grid-art"></div></section>
  <section class="group" id="sec-vid" aria-labelledby="g-vid" hidden><p class="group-label" id="g-vid">YouTube</p><div class="grid vhs-grid" id="grid-vid"></div></section>

  <p class="hints"><span><kbd class="kbd-arr"><svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></kbd>Elegir</span><span><kbd>Enter</kbd>Abrir</span><span><kbd>Esc</kbd>Volver</span></p>
</div>

<div class="stage" id="stage" hidden>
  <div class="fly" id="fly"><div class="box" id="box">
    <div class="face f-back"></div>
    <div class="face f-inside" id="f-inside"></div>
    <div class="face f-left"></div><div class="face f-right"></div>
    <div class="face f-top"></div><div class="face f-bottom"></div>
    <div class="face f-lid" id="f-lid"><div class="lid-front" id="lid-front"></div><div class="lid-back" id="lid-back"></div></div>
  </div></div>
</div>

<div class="tv" id="tv" hidden role="dialog" aria-modal="true" aria-labelledby="tv-title">
  <div class="tv-box"><div class="tv-screen" id="tv-screen"></div>
    <div class="tv-bar"><strong id="tv-title"></strong><div><a class="btn primary" id="tv-yt" href="#" target="_blank" rel="noopener">Ver en YouTube ↗</a><button type="button" class="btn" id="tv-close">Cerrar ✕</button></div></div></div>
</div>
<div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="Imagen ampliada"><button type="button" class="btn" id="lb-close">Cerrar ✕</button><div class="lb-media" id="lb-media"></div><p id="lb-cap"></p></div>
<div class="crt" aria-hidden="true"><i class="rgb"></i><i class="scan"></i><i class="flick"></i><i class="roll"></i><i class="glass"></i><i class="curve"></i></div>
<div class="screen" id="screen" hidden role="dialog" aria-modal="true" aria-labelledby="scr-title"><div class="panel" id="panel"></div></div>

<script>
(async () => {
/* ---------- contenido: se edita en content/juegos.json, content/arte.json y content/perfil.json ---------- */
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = v => esc(String(v || '').replace(/^\/+/, ''));            // rutas relativas a la web
const slug = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'item';
const list = v => (Array.isArray(v) ? v : []).filter(x => x !== null && x !== undefined && x !== '');
const strs = v => { const l = list(v).map(esc); return l.length ? l : null; };
const ytId = u => { const m = String(u || '').match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(u || '') ? u : null); };
const SCORE_KIND = {metacritic:'mc', 'metacritic-usuarios':'mcu', opencritic:'oc', steam:'steam', itch:'itch'};
const LOGO_POS = {arriba:'position:absolute;top:18%;left:50%;transform:translateX(-50%)', abajo:'position:absolute;bottom:10%;left:50%;transform:translateX(-50%)'};
const usedIds = new Set();
const uniqueId = t => { let id = slug(t), n = 2; while (usedIds.has(id)) id = slug(t) + '-' + n++; usedIds.add(id); return id; };

function fromGame(g){
  const c = g.cuadro || {}, col = g.colores || {}, tr = g.trailer || {};
  const vid = ytId(tr.url);
  const gal = list(g.galeria).filter(x => x.archivo).map(x => [P(x.archivo), esc(x.titulo), esc(x.enlace)]);
  const aw = list(g.premios).filter(x => x.evento).map(x => ({res:esc(x.resultado || 'Nominado'), ev:esc(x.evento), cat:esc(x.categoria), icon:P(x.icono)}));
  const sc = list(g.notas).filter(x => x.valor).map(x => ({src:esc(x.fuente), kind:SCORE_KIND[x.tipo] || '', val:esc(x.valor), sub:esc(x.detalle), url:esc(x.enlace)}));
  const ln = list(g.enlaces).filter(x => x.url).map(x => [esc(x.texto || x.url), esc(x.url)]);
  return {
    id: uniqueId(g.titulo), kind:'game', title: esc(g.titulo), year: esc(g.anio), genre: esc(g.genero),
    engine: esc(g.motor), studio: esc(g.estudio), publisher: esc(g.publisher), platforms: esc(g.plataformas),
    a: esc(col.principal || '#9aa3ad'), b: esc(col.secundario || '#6b7480'),
    img: P(g.imagenDisco || c.fondo), discFull: g.disco ? P(g.disco) : null,
    bg: c.fondo ? P(c.fondo) : null, logo: c.logo ? P(c.logo) : null,
    logoW: Number(c.tamanoLogo) || 80, shade: (Number(c.oscurecer) || 0) / 100, logoCss: LOGO_POS[c.posicionLogo] || '',
    video: vid ? {id: vid, label: esc(tr.titulo || 'Tráiler'), thumb: tr.miniatura ? P(tr.miniatura) : `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`} : null,
    blurb: esc(g.descripcion), role: esc(g.papel), did: strs(g.queHice), tools: strs(g.herramientas),
    gallery: gal.length ? gal : null, awards: aw.length ? aw : null, scores: sc.length ? sc : null, links: ln
  };
}
function fromArt(a){
  const col = a.colores || {};
  const pcs = list(a.piezas).filter(x => x.archivo).map(x => [esc(x.titulo), esc(x.subtitulo), esc(x.enlace), P(x.archivo)]);
  return {
    id: uniqueId(a.titulo), kind:'art', title: esc(a.titulo), genre: esc(a.genero), blurb: esc(a.descripcion),
    a: esc(col.principal || '#9aa3ad'), b: esc(col.secundario || '#6b7480'), img: P(a.portada),
    pos: {arriba:'center 22%', abajo:'center 80%'}[a.encuadre] || null,
    fit: a.ajustePortada === 'contener' ? 'contain' : null, bgc: '#ffffff', pieces: pcs
  };
}
// "?t=..." evita que el navegador o GitHub sirvan una copia antigua: lo guardado en el panel se ve en cuanto GitHub lo publica
async function getJSON(url){ const r = await fetch(url + '?t=' + Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }
let juegos = [], arte = [], PERFIL = {}, videos = [];
try {
  [juegos, arte, PERFIL, videos] = await Promise.all([getJSON('content/juegos.json'), getJSON('content/arte.json'), getJSON('content/perfil.json'), getJSON('content/videos.json').catch(() => [])]);
  if (Array.isArray(PERFIL)) PERFIL = PERFIL[0] || {};
} catch (err) {
  document.getElementById('sel-title').textContent = 'No se ha podido cargar el contenido';
  document.getElementById('sel-meta').textContent = 'Revisa que los archivos de la carpeta content estén bien escritos.';
  console.error(err); return;
}
const pc = PERFIL.colores || {};
document.documentElement.classList.toggle('crt-on', PERFIL.filtroCRT !== false);   // filtro de tele antigua, se apaga desde el panel
const ITEMS = [
  ...list(juegos).map(fromGame),
  ...(PERFIL.mostrarArte === false ? [] : list(arte).map(fromArt)),   // la sección Arte se puede ocultar desde el panel
  {id:'sobre-mi', key:'about', kind:'about', title:'Sobre mí', genre:'Ficha', a: esc(pc.principal || '#f0a070'), b: esc(pc.secundario || '#e97f45'), img: P(PERFIL.avatar)},
  {id:'contacto', key:'contact', kind:'contact', title:'Contacto', genre:'Hablemos', a:'#ffd06b', b:'#f5a524'}
];
const GAMES = ITEMS.filter(i=>i.kind==='game');
if (!ITEMS.some(i=>i.kind==='art')) document.getElementById('sec-art').hidden = true;

/* cabecera desde el perfil */
const CV = String(PERFIL.cv || 'docs/cv.pdf').replace(/^\/+/, '');
document.querySelector('.me h1').textContent = PERFIL.nombre || '';
if (PERFIL.nombre) document.title = PERFIL.nombre + ' Portfolio';   // el nombre de la pestaña sigue al del panel
document.querySelector('.me p').textContent = [PERFIL.profesion, PERFIL.ciudad].filter(Boolean).join(' · ');
if (PERFIL.avatar) { const av = document.querySelector('.avatar'); av.src = String(PERFIL.avatar).replace(/^\/+/, ''); av.alt = 'Avatar de ' + (PERFIL.nombre || ''); }
const cvA = document.getElementById('cv-link'); cvA.href = CV; cvA.setAttribute('download', 'CV_' + slug(PERFIL.nombre || 'cv') + '.pdf');

const KINDS=['game','art'];

/* ---------- portadas y cuadrícula ---------- */
const vars = it => `--a:${it.a};--b:${it.b}`;
function ribbon(a){
  const tip=`${a.res} · ${a.ev} · ${a.cat}`.replace(/"/g,'');
  if(a.img) return `<img class="rib-img" src="${a.img}" alt="${tip}" title="${tip}">`;
  const [l1,l2]=a.lines||[a.ev,''];
  return `<div class="rib${a.res==='Ganador'?' win':''}" title="${tip}" role="img" aria-label="${tip}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0z M5 5H3v1.5A3.5 3.5 0 0 0 6.5 10M19 5h2v1.5A3.5 3.5 0 0 1 17.5 10M12 13v4M8.5 20h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="stars">★★★</span><b>${l1}</b><b>${l2}</b><i></i><em>${a.res==='Ganador'?'Ganador':'Nominado'}</em><small>2026</small></div>`;
}
const artHTML = it => {
  if(it.logo) return `<div class="art-wrap"><div class="art comp" style="${vars(it)};background-image:url(${it.bg});--shade:${it.shade||0}">`
    + (it.char?`<img class="char" src="${it.char}" alt="" style="${it.charCss||''}">`:'')
    + `<img class="logo" src="${it.logo}" alt="${it.title}" style="width:${it.logoW||78}%;${it.logoCss||''}">`
    + `</div></div>`;
  const extra = it.img ? `;background-image:url(${it.img})${it.pos?`;background-position:${it.pos}`:''}${it.fit?`;background-size:${it.fit};background-repeat:no-repeat;background-color:${it.bgc||'#fff'};background-origin:content-box;padding:12%`:''}` : '';
  return `<div class="art-wrap"><div class="art${it.img?'':' plain'}" style="${vars(it)}${extra}">${it.img?'':`<span class="t">${it.title}</span>`}</div></div>`;
};
const tiles = {};
ITEMS.forEach((it,i)=>{
  if(!KINDS.includes(it.kind)) return;
  const b=document.createElement('button');b.type='button';b.className='tile';b.dataset.i=i;
  b.setAttribute('aria-label',`Abrir ${it.title}`);
  b.innerHTML=`<span class="frame">${artHTML(it)}</span><span class="caption">${it.title}</span>`;
  document.getElementById('grid-'+it.kind).appendChild(b); tiles[i]=b;
});
const order = Object.keys(tiles).map(Number);

const selTitle=document.getElementById('sel-title'), selMeta=document.getElementById('sel-meta');
let sel=-1;
/* el borde azul se queda en el último cuadro elegido, sea un juego o una cinta */
function markSel(el){ document.querySelectorAll('.tile.is-sel').forEach(t=>{ if(t!==el) t.classList.remove('is-sel'); }); el.classList.add('is-sel'); }
function metaOf(it){
  if(it.kind==='game') return [it.year,it.genre,it.role].filter(Boolean).join(' · ');
  if(it.kind==='art') return `${it.genre} · ${it.pieces.length} piezas`;
  return '';
}
function select(i,{focus=false,sound=true}={}){
  if(i===sel && tiles[i].classList.contains('is-sel')) return;
  markSel(tiles[i]); sel=i; if(focus) tiles[i].focus();
  if(ITEMS[i].discFull) iriMask(ITEMS[i].discFull);
  selTitle.textContent=ITEMS[i].title; selMeta.textContent=metaOf(ITEMS[i]);
  if(sound) tone([1320],.05,.02);
}
Object.entries(tiles).forEach(([i,b])=>{ i=+i;
  b.addEventListener('mouseenter',()=>select(i));
  b.addEventListener('focus',()=>select(i,{sound:false}));
  b.addEventListener('click',()=>openItem(i,true));
});
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{
  openItem(ITEMS.findIndex(it=>it.key===b.dataset.open),false);}));

/* ---------- CV: en el visor de Claude se guarda con la capacidad de descargas; en una web normal funciona el enlace ---------- */
let DL=null;
(async()=>{ try{ DL = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(e){ DL=null; } })();
document.getElementById('cv-link').addEventListener('click', async e=>{
  if(!DL) return;
  e.preventDefault();
  try{ const blob = await (await fetch(CV)).blob(); await DL.save({filename:'CV_' + slug(PERFIL.nombre || 'cv') + '.pdf', data:blob}); tone([988,1319],.06); }
  catch(err){ /* el visitante puede cancelar; no se reintenta */ }
});

/* ---------- modo claro / oscuro ---------- */
const modeBtn=document.getElementById('mode');
const syncMode=()=>modeBtn.setAttribute('aria-checked', document.documentElement.getAttribute('data-mode')==='dark');
syncMode();
modeBtn.addEventListener('click',()=>{
  const next = document.documentElement.getAttribute('data-mode')==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-mode', next); syncMode();
  try{ localStorage.setItem('modo', next); }catch(e){}
  tone(next==='dark'?[880,660]:[660,880],.06);
});

/* ---------- reloj ---------- */
const clock=document.getElementById('clock');
const tick=()=>{clock.textContent=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})};
tick(); setInterval(tick,15000);

/* ---------- sonido ---------- */
let AC=null, soundOn=true;
const sndBtn=document.getElementById('snd');
sndBtn.addEventListener('click',()=>{soundOn=!soundOn;sndBtn.setAttribute('aria-pressed',soundOn);if(soundOn)tone([988,1319],.07)});
function tone(freqs,dur=.08,vol=.05){ if(!soundOn) return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
  const t0=AC.currentTime+.01; freqs.forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
    const s=t0+k*dur*.8; g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.008);g.gain.exponentialRampToValueAtTime(.0001,s+dur*1.6);
    o.connect(g).connect(AC.destination);o.start(s);o.stop(s+dur*1.7)});}catch(e){} }

/* ---------- estuche 3D ---------- */
const stage=document.getElementById('stage'), fly=document.getElementById('fly'), box=document.getElementById('box'), lid=document.getElementById('f-lid');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* inclinación 3D de los cuadros y cintas al mover el ratón por encima */
if (matchMedia('(hover:hover) and (pointer:fine)').matches && !reduce) {
  let cur = null;
  const flat = t => { if (!t) return; t.classList.remove('tilting'); ['--tx','--ty','--gx','--gy'].forEach(k => t.style.removeProperty(k)); };
  document.addEventListener('pointermove', e => {
    const t = e.target.closest && e.target.closest('.tile');
    if (t !== cur) { flat(cur); if (cur) cur.classList.remove('tilt-off'); cur = t; }
    if (!t || t.classList.contains('tilt-off')) return;
    const f = t.querySelector('.frame'), r = t.getBoundingClientRect(), h = f.offsetHeight;
    const x = Math.max(-1, Math.min(1, (e.clientX - r.left) / r.width * 2 - 1)), y = Math.max(-1, Math.min(1, (e.clientY - r.top) / h * 2 - 1));
    t.style.setProperty('--tx', (-y * 7).toFixed(2) + 'deg'); t.style.setProperty('--ty', (x * 9).toFixed(2) + 'deg');
    t.style.setProperty('--gx', ((x + 1) * 50).toFixed(1) + '%'); t.style.setProperty('--gy', ((y + 1) * 50).toFixed(1) + '%');
    t.classList.add('tilting');
  }, {passive:true});
  document.addEventListener('pointerleave', () => { flat(cur); if (cur) cur.classList.remove('tilt-off'); cur = null; });
  /* al pulsar, el cuadro vuelve recto al instante para que la animación salga desde su sitio */
  document.addEventListener('pointerdown', e => { const t = e.target.closest && e.target.closest('.tile'); if (t) { t.classList.add('tilt-off'); flat(t); } }, true);
}
function manualPic(it){
  const firstStill = list => (list||[]).map(x=>x.find(v=>typeof v==='string'&&v.startsWith('img/'))).find(f=>f&&!/\.mp4$/.test(f));
  return firstStill(it.gallery) || firstStill(it.pieces) || it.img || '';
}
const PAD = `<svg viewBox="0 0 60 36" aria-hidden="true"><rect x="1.5" y="4" width="57" height="28" rx="14" fill="#fff" stroke="#c9cbcf" stroke-width="2"/>
  <path d="M14 13v10M9 18h10" stroke="var(--b)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="43" cy="14" r="3" fill="var(--b)"/><circle cx="49" cy="19" r="3" fill="#c9cbcf"/><circle cx="37" cy="19" r="3" fill="#c9cbcf"/><circle cx="43" cy="24" r="3" fill="var(--b)"/></svg>`;
const manualHTML = it => { const pic=manualPic(it);
  return `<div class="manual"><div class="m-head"><span>MANUAL</span><span>ES</span></div>
    <div class="m-pic" style="${pic?`background-image:url(${pic})`:''}"></div>
    <div class="m-title">${it.title}</div>
    <div class="m-row">${PAD}<div class="m-lines"><i></i><i></i><i></i></div></div>
    <div class="m-foot"><span>Diego Requena</span><span>p. 1</span></div></div>`; };
const iriCache = {};
function iriMask(src){
  if(!iriCache[src]) iriCache[src] = new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const N = 512, c = document.createElement('canvas'); c.width = c.height = N;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, N, N);
      let d; try { d = x.getImageData(0, 0, N, N); } catch(e) { return res(null); }
      const p = d.data;
      for(let k = 0; k < p.length; k += 4){
        const r = p[k], g = p[k+1], b = p[k+2], a = p[k+3];
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 510, sat = mx ? (mx - mn) / mx : 0;
        // gris claro/plateado = poca saturación y bastante luz; el negro, el blanco puro y los colores vivos quedan fuera
        const v = (sat < .16 && l > .55 && l < .97) ? Math.min(1, (l - .55) / .15) * Math.min(1, (.16 - sat) / .06) : 0;
        p[k] = p[k+1] = p[k+2] = 255; p[k+3] = Math.round(v * a);
      }
      x.putImageData(d, 0, 0); res(c.toDataURL());
    };
    im.onerror = () => res(null); im.src = src;
  });
  return iriCache[src];
}
const iriHTML = auto => `<div class="d-iri${auto ? ' auto' : ''}"><i></i><b></b></div>`;
function dressBox(i){
  const it=ITEMS[i], r=tiles[i].querySelector('.frame').getBoundingClientRect();
  const vw=innerWidth, vh=innerHeight, s=Math.min(vh*.5/r.height, vw*.42/r.width, 1.9);
  const W=r.width*s, H=r.height*s, D=Math.max(10,Math.round(W*.08));
  fly.style.cssText=`--w:${W}px;--h:${H}px;--d:${D}px;${vars(it)}`;
  document.getElementById('lid-front').innerHTML=artHTML(it);
  document.getElementById('lid-back').innerHTML=manualHTML(it);
  const discImg = it.img;
  const code=`DR-${String(i+1).padStart(4,'0')}`;
  // si hay un disco diseñado entero (plantilla de Photoshop), se usa tal cual y solo se dibuja el centro encima
  document.getElementById('f-inside').innerHTML = `<div class="disc-wrap">` + (it.discFull ? `<div class="disc full"><div class="d-full" style="background-image:url(${it.discFull})"></div><div class="d-rim"></div>${iriHTML(false)}</div>` : `<div class="disc" style="${discImg?`--img:url(${discImg})`:''}">
    <div class="d-art"></div>
    <div class="d-band"><span class="mk">DR</span><span class="cd"><b>${code}</b>MADE IN BARCELONA</span><span class="dk">disc<small>PORTFOLIO</small></span></div>
    <div class="d-foot"><strong>RKNA</strong><span>© ${it.year||2026} Diego Requena</span></div><div class="d-rim"></div>${iriHTML(true)}</div>`) + `<div class="d-hub"></div></div>`;
  if(it.discFull) iriMask(it.discFull).then(url => { const el = document.querySelector('#f-inside .d-iri');
    if(el && url){ el.style.webkitMaskImage = el.style.maskImage = `url(${url})`; } else if(el){ el.classList.add('auto'); } });
  // k = escala para que coincida con el cuadro; abierto ocupa dos anchos (tapa + disco): se centra el conjunto
  return {W,H,D,s,k:1/s,z:80*s,x0:r.left+r.width/2-W/2,y0:r.top+r.height/2-H/2,x1:vw/2-W/2+W*0.47,y1:vh/2-H/2};
}
const ease='cubic-bezier(.2,.7,.2,1)';
const anim=(el,kf,dur,e=ease)=>el.animate(kf,{duration:dur,easing:e,fill:'forwards'}).finished;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function clearAnims(){[fly,box,lid].forEach(el=>el.getAnimations().forEach(a=>a.cancel()))}
const TILT='translateZ(0px) rotateY(-22deg) rotateX(8deg)', OPEN='translateZ(0px) rotateY(-6deg) rotateX(3deg)';

/* ---------- ficha ---------- */
const screen=document.getElementById('screen'), panel=document.getElementById('panel');
let current=-1, busy=false, selfHash=false;
const markOut=i=>{Object.values(tiles).forEach(t=>t.classList.remove('is-out')); if(tiles[i]) tiles[i].classList.add('is-out');};

async function openItem(i, fromTile){
  if(busy||i<0) return; busy=true; current=i;
  tone([784,988,1319],.08);
  if(fromTile && tiles[i] && !reduce){
    markOut(-1); const g=dressBox(i); markOut(i);
    clearAnims(); stage.hidden=false;
    const lz=`translateZ(${g.D/2}px)`; lid.style.transform=lz+' rotateY(0deg)';
    await Promise.all([anim(fly,[{transform:`translate(${g.x0}px,${g.y0}px) scale(${g.k})`},{transform:`translate(${g.x0}px,${g.y0-10}px) scale(${g.k})`}],200),
                       anim(box,[{transform:'translateZ(0px)'},{transform:`translateZ(${g.z}px)`}],200)]);
    await Promise.all([anim(fly,[{transform:`translate(${g.x0}px,${g.y0-10}px) scale(${g.k})`},{transform:`translate(${g.x1}px,${g.y1}px) scale(1)`}],640),
                       anim(box,[{transform:`translateZ(${g.z}px)`},{transform:TILT}],640)]);
    tone([659,880],.07);
    await Promise.all([anim(lid,[{transform:lz+' rotateY(0deg)'},{transform:lz+' rotateY(-150deg)'}],540,'cubic-bezier(.3,1.25,.5,1)'),
                       anim(box,[{transform:TILT},{transform:OPEN}],540)]);
    await wait(260);
    await insertDisc(g);
    render(i);
    await screenOn();
    stage.hidden=true; clearAnims(); document.querySelector('.insert-layer')?.remove();
  } else { markOut(i); render(i); await screenOn(); }
  setHash(ITEMS[i].id); busy=false;
}
/* el disco sale del estuche, da unas vueltas y entra en una ranura invisible */
async function insertDisc(g){
  const src = document.querySelector('#f-inside .disc-wrap'); if(!src) return;
  const r = src.getBoundingClientRect(), size = Math.max(r.width, r.height);
  const vw = innerWidth, vh = innerHeight, big = Math.min(vw * .62, vh * .5, size * 1.35);
  const layer = document.createElement('div'); layer.className = 'insert-layer';
  layer.style.cssText = vars(ITEMS[current]);
  const d = document.createElement('div'); d.className = 'insert-disc';
  d.style.cssText = `width:${size}px;height:${size}px;`;
  // el giro va en una capa propia para que no dependa del movimiento: gira a ritmo continuo mientras baja
  const spin = document.createElement('div'); spin.style.cssText = 'width:100%;height:100%';
  spin.appendChild(src.cloneNode(true)); d.appendChild(spin);
  const slotY = vh / 2 + big * .62, slot = document.createElement('div'); slot.className = 'slot-line';
  slot.style.cssText = `left:${vw/2 - big*.65}px;width:${big*1.3}px;top:${slotY - 5}px`;
  layer.append(d, slot); document.body.appendChild(layer);
  src.style.visibility = 'hidden';
  const x0 = r.left + r.width/2 - size/2, y0 = r.top + r.height/2 - size/2;
  const cx = vw/2 - size/2, cy = vh/2 - size/2 - big*.08, k = big / size;
  tone([523,659,784],.06);
  // 1) sale del estuche hacia el centro y crece mientras el estuche se desvanece
  anim(fly,[{opacity:1},{opacity:0}],420);
  await anim(d,[{transform:`translate(${x0}px,${y0}px) scale(1)`},{transform:`translate(${cx}px,${cy}px) scale(${k})`}],560,'cubic-bezier(.3,.6,.2,1)');
  // 2) empieza a girar, coge velocidad y, sin frenar, entra en la ranura
  const spinning = anim(spin,[{transform:'rotate(0deg)'},{transform:'rotate(1260deg)'}],900,'cubic-bezier(.45,0,1,1)');
  await wait(420);
  layer.style.clipPath = `inset(0 0 ${vh - slotY}px 0)`;   // lo que pasa de la línea desaparece
  anim(slot,[{opacity:0},{opacity:.9,offset:.25},{opacity:.9,offset:.7},{opacity:0}],460,'linear');
  tone([392,330],.07);
  await Promise.all([spinning,
    anim(d,[{transform:`translate(${cx}px,${cy}px) scale(${k})`},{transform:`translate(${cx}px,${slotY - size/2 + big*.62}px) scale(${k})`}],480,'cubic-bezier(.5,0,.9,.5)')]);
  await wait(60);
}
async function closeItem(){
  if(busy||current<0) return; busy=true; tone([1319,988,784],.07);
  const i=current;
  await screenOff();
  if(tiles[i] && !reduce){
    markOut(-1); const g=dressBox(i); markOut(i);
    clearAnims(); stage.hidden=false;
    const lz=`translateZ(${g.D/2}px)`;
    fly.style.transform=`translate(${g.x1}px,${g.y1}px) scale(1)`;
    await Promise.all([anim(lid,[{transform:lz+' rotateY(-150deg)'},{transform:lz+' rotateY(0deg)'}],300),
                       anim(box,[{transform:OPEN},{transform:TILT}],300)]);
    await Promise.all([anim(fly,[{transform:`translate(${g.x1}px,${g.y1}px) scale(1)`},{transform:`translate(${g.x0}px,${g.y0-10}px) scale(${g.k})`}],520),
                       anim(box,[{transform:TILT},{transform:`translateZ(${g.z}px)`}],520)]);
    await Promise.all([anim(fly,[{transform:`translate(${g.x0}px,${g.y0-10}px) scale(${g.k})`},{transform:`translate(${g.x0}px,${g.y0}px) scale(${g.k})`}],180),
                       anim(box,[{transform:`translateZ(${g.z}px)`},{transform:'translateZ(0px)'}],180)]);
    stage.hidden=true; clearAnims(); fly.style.transform='';
  }
  markOut(-1); current=-1; setHash('');
  if(tiles[i]){ tiles[i].focus({preventScroll:true}); select(i,{sound:false}); }
  busy=false;
}
async function step(d){
  if(busy) return; busy=true;
  const n=(current+d+ITEMS.length)%ITEMS.length;
  current=n; markOut(n); if(tiles[n]) select(n,{sound:false});
  tone([d>0?1047:880],.06);
  if(!reduce) await anim(panel,[{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${d*-24}px)`}],140,'ease-in');
  render(n); screen.scrollTop=0; setHash(ITEMS[n].id);
  if(!reduce) await anim(panel,[{opacity:0,transform:`translateX(${d*24}px)`},{opacity:1,transform:'none'}],200);
  panel.getAnimations().forEach(a=>a.cancel());
  busy=false;
}
async function screenOn(){
  screen.hidden=false; document.body.classList.add('locked'); screen.scrollTop=0;
  if(!reduce) await Promise.all([anim(screen,[{opacity:0},{opacity:1}],240),
    anim(panel,[{opacity:0,transform:'scale(.92)'},{opacity:1,transform:'scale(1)'}],360,'cubic-bezier(.2,1.15,.4,1)')]);
  [screen,panel].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
  panel.querySelector('[data-act="back"]').focus({preventScroll:true});
}
async function screenOff(){
  if(!reduce) await Promise.all([anim(panel,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.94)'}],200,'ease-in'),
    anim(screen,[{opacity:1},{opacity:0}],220,'ease-in')]);
  screen.hidden=true; document.body.classList.remove('locked'); [screen,panel].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
}
function setHash(h){ selfHash=true;
  if(h) location.hash=h; else history.replaceState(null,'',location.pathname+location.search);
  setTimeout(()=>selfHash=false,0); }

/* ---------- plantillas ---------- */
const chips = t => `<div class="chips">${t.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;
const linksHTML = (l,first=true) => !l || !l.length ? '' : `<div class="actions">${l.map(([t,u],k)=>`<a class="btn${k===0&&first?' primary':''}" href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join('')}</div>`;
const isVid = f => /\.mp4$/.test(f);
const isPx = f => /(cf-[abc]|an-run|an-jump)\.gif$/.test(f);
const media = (im,t,cls='') => isVid(im) ? `<video src="${im}" muted loop autoplay playsinline preload="metadata"${cls?` class="${cls}"`:''}></video>` : `<img src="${im}" alt="${t.replace(/"/g,'')}" loading="lazy"${cls?` class="${cls}"`:''}>`;
const gallery = g => `<div class="pieces">${g.map(([im,t,u,s])=>{
  const px=isPx(im)?'px':'';
  return u ? `<a class="piece" href="${u}" target="_blank" rel="noopener">${media(im,t,px)}<strong>${t}</strong><span>${s?s+' · ':''}Ver en ${u.includes('itch.io')?'itch.io':'ArtStation'} ↗</span></a>`
           : `<button type="button" class="piece" data-act="view" data-src="${im}" data-t="${t.replace(/"/g,'')}">${media(im,t,px)}<strong>${t}</strong><span>${s?s+' · ':''}Ampliar</span></button>`;}).join('')}</div>`;
function trailer(it){
  if(!it.video) return '';
  const v=it.video;
  return `<a class="yt" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" data-yt="${v.id}" aria-label="Ver ${v.label} de ${it.title}" style="background-image:url(${v.thumb})">
    <span class="yt-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>
    <span class="yt-label">${v.label}<small>YouTube</small></span></a>`;
}
function reception(it){
  if(!it.awards && !it.scores) return '';
  const aw = it.awards ? `<div class="rc-block"><span class="lbl">Premios y nominaciones</span><ul class="awards">${it.awards.map(a=>
      `<li class="${a.res==='Ganador'?'is-win':''}"><span class="trophy ${a.res==='Ganador'?'win':''}" aria-hidden="true">${a.icon?`<img src="${a.icon}" alt="">`:`<svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z M5 5H3v1.5A3.5 3.5 0 0 0 6.5 10M19 5h2v1.5A3.5 3.5 0 0 1 17.5 10M12 13v4M8.5 20h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}</span>
       <span class="aw-txt"><span class="res ${a.res==='Ganador'?'win':''}">${a.res}</span><strong>${a.ev}</strong><span>${a.cat}</span></span></li>`).join('')}</ul></div>` : '';
  const sc = it.scores ? `<div class="rc-block"><span class="lbl">Crítica y jugadores</span><div class="scores">${it.scores.map(x=>
      `<a class="score" href="${x.url}" target="_blank" rel="noopener"><span class="badge ${x.kind}">${x.val}</span><span class="sc-txt"><strong>${x.src} ↗</strong><span>${x.sub}</span></span></a>`).join('')}</div></div>` : '';
  return `<section class="reception" aria-label="Premios y críticas">${aw}${sc}</section>`;
}
function render(i){
  const it=ITEMS[i];
  const bar=`<div class="scr-bar">
    <button type="button" class="btn" data-act="back"><svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Volver al menú</button>
    <div class="dots" aria-label="${i+1} de ${ITEMS.length}">${ITEMS.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('')}</div>
    <div class="pager"><button type="button" class="btn round" data-act="prev" aria-label="Anterior"><svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="btn round" data-act="next" aria-label="Siguiente"><svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>`;
  let info='';
  if(it.kind==='game'){
    const gi=GAMES.indexOf(it)+1;
    info=`<div class="tags"><span class="tag">Juego ${gi} de ${GAMES.length}</span>${it.year?`<span class="tag">${it.year}</span>`:''}${it.engine?`<span class="tag">${it.engine}</span>`:''}</div>
      <h3 id="scr-title">${it.title}</h3>
      ${trailer(it)}
      <p>${it.blurb}</p>
      <div class="role"><span class="lbl">Mi papel</span>${it.role?`<strong>${it.role}</strong>`:`<span class="tag todo">Por completar</span>`}</div>
      ${it.did?`<div class="sec"><span class="lbl">Qué hice</span><ul class="did">${it.did.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:''}
      ${it.gallery?`<div class="sec"><span class="lbl">Arte del proyecto</span>${gallery(it.gallery)}</div>`:''}
      ${reception(it)}
      ${it.tools?`<div class="sec"><span class="lbl">Herramientas</span>${chips(it.tools)}</div>`:''}
      <dl class="meta"><dt>Estudio</dt><dd>${it.studio}</dd>${it.publisher?`<dt>Publisher</dt><dd>${it.publisher}</dd>`:''}${it.platforms?`<dt>Plataformas</dt><dd>${it.platforms}</dd>`:''}<dt>Género</dt><dd>${it.genre}</dd></dl>
      ${linksHTML(it.links)}`;
  } else if(it.kind==='art'){
    info=`<div class="tags"><span class="tag">${it.genre}</span><span class="tag">${it.pieces.length} piezas</span></div>
      <h3 id="scr-title">${it.title}</h3><p>${it.blurb}</p>
      ${gallery(it.pieces.map(([t,s,u,im])=>[im,t,u,s]))}`;
  } else if(it.kind==='about'){
    const bio = String(PERFIL.bio || '').split(/\n\s*\n/).map(t => t.trim()).filter(Boolean).map(t => `<p>${esc(t)}</p>`).join('');
    const tags = [PERFIL.ciudad, PERFIL.idiomas].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const sec = (l, v) => { const x = strs(v); return x ? `<div class="sec"><span class="lbl">${l}</span>${chips(x)}</div>` : ''; };
    info=`<div class="tags">${tags}</div>
      <h3 id="scr-title">Sobre mí</h3>
      ${bio}
      ${sec('Especialidades', PERFIL.especialidades)}
      ${sec('Software', PERFIL.software)}
      ${sec('Trabajo en equipo', PERFIL.equipo)}`;
  } else {
    const redes = list(PERFIL.redes).filter(x => x.url).map(x => [esc(x.texto || x.url), esc(x.url)]);
    info=`${PERFIL.disponibilidad ? `<span class="status">${esc(PERFIL.disponibilidad)}</span>` : ''}
      <h3 id="scr-title">¿Hablamos?</h3>
      ${PERFIL.mensajeContacto ? `<p>${esc(PERFIL.mensajeContacto)}</p>` : ''}
      ${PERFIL.email ? `<div class="sec"><span class="lbl">Correo</span><div class="mail"><code id="mail">${esc(PERFIL.email)}</code><button type="button" class="btn primary" data-act="copy">Copiar</button></div></div>` : ''}
      ${redes.length ? `<div class="sec"><span class="lbl">Dónde encontrarme</span>${linksHTML(redes,false)}</div>` : ''}`;
  }
  panel.innerHTML = bar + `<div class="scr-grid${it.video?' has-video':''}"><div class="media"><div class="frame">${artHTML(it)}</div></div><div class="info">${info}</div></div>`;
}
panel.addEventListener('click',e=>{
  const yt=e.target.closest('.yt');
  if(yt && !(window.claude && window.claude.use)){
    e.preventDefault();
    const f=document.createElement('iframe');
    f.src=`https://www.youtube-nocookie.com/embed/${yt.dataset.yt}?autoplay=1&rel=0`;
    f.title=yt.getAttribute('aria-label'); f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen=true; f.className='yt-frame';
    yt.replaceWith(f); return;
  }
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='back') closeItem(); else if(a==='prev') step(-1); else if(a==='next') step(1);
  else if(a==='view') openLB(b.dataset.src,b.dataset.t,b);
  else if(a==='copy'){ const done=()=>{b.textContent='Copiado';tone([1319,1760],.06)};
    try{ navigator.clipboard.writeText(PERFIL.email || '').then(done,selectMail); }catch(err){ selectMail(); } }
});

const tv = document.getElementById('tv'); let tvFrom = null, tapeBusy = false;
async function playTape(tile, v){
  if (tapeBusy) return; tapeBusy = true; tvFrom = tile;
  tone([523, 659, 784], .07);
  if (!reduce) await insertTape(tile);
  openTV(v); tapeBusy = false;
}
/* la cinta sale de la cuadrícula y entra en una ranura invisible, como en un vídeo VHS */
async function insertTape(tile){
  const src = tile.querySelector('.vhs'), r = src.getBoundingClientRect(), vw = innerWidth, vh = innerHeight;
  const W = Math.min(vw * .74, 560), k = W / r.width, Hs = r.height * k;
  const layer = document.createElement('div'); layer.className = 'insert-layer';
  const d = document.createElement('div'); d.className = 'insert-disc'; d.style.cssText = `width:${r.width}px;height:${r.height}px`;
  const c = src.cloneNode(true); c.classList.add('playing'); d.appendChild(c);
  const slotY = vh / 2 + Hs * .62, slot = document.createElement('div'); slot.className = 'slot-line';
  slot.style.cssText = `left:${vw/2 - W*.58}px;width:${W*1.16}px;top:${slotY - 5}px`;
  layer.append(d, slot); document.body.appendChild(layer); src.style.visibility = 'hidden';
  const cx = vw/2 - r.width/2, cy = vh/2 - r.height/2 - Hs*.04;
  await anim(d, [{transform:`translate(${r.left}px,${r.top}px) scale(1)`}, {transform:`translate(${cx}px,${cy}px) scale(${k})`}], 520, 'cubic-bezier(.3,.6,.2,1)');
  await wait(220);
  layer.style.clipPath = `inset(0 0 ${vh - slotY}px 0)`;
  anim(slot, [{opacity:0}, {opacity:.9, offset:.25}, {opacity:.9, offset:.7}, {opacity:0}], 460, 'linear');
  tone([392, 330], .07);
  await anim(d, [{transform:`translate(${cx}px,${cy}px) scale(${k})`}, {transform:`translate(${cx}px,${slotY + Hs*.56 - r.height/2}px) scale(${k})`}], 440, 'cubic-bezier(.5,0,.9,.5)');
  await wait(60); layer.remove(); src.style.visibility = '';
}
function openTV(v){
  const scr = document.getElementById('tv-screen'); scr.style.backgroundImage = `url(${v.thumb})`;
  const inClaude = !!(window.claude && window.claude.use);   // la vista previa de Claude no permite reproductores incrustados
  scr.innerHTML = inClaude
    ? `<a class="tv-open" href="${v.url}" target="_blank" rel="noopener"><span class="yt-play"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span></a>`
    : `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0" title="${v.title}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  document.getElementById('tv-title').innerHTML = v.title; document.getElementById('tv-yt').href = v.url;
  tv.hidden = false; document.body.classList.add('locked');
  if (!reduce) anim(tv.querySelector('.tv-box'), [{opacity:0, transform:'scale(.92)'}, {opacity:1, transform:'scale(1)'}], 320, 'cubic-bezier(.2,1.15,.4,1)');
  document.getElementById('tv-close').focus({preventScroll:true});
}
function closeTV(){
  tv.hidden = true; document.getElementById('tv-screen').innerHTML = ''; document.body.classList.remove('locked');
  tone([784, 523], .06); if (tvFrom) tvFrom.focus({preventScroll:true});
}
document.getElementById('tv-close').addEventListener('click', closeTV);
tv.addEventListener('click', e => { if (e.target === tv) closeTV(); });

const lb=document.getElementById('lb'); let lbFrom=null;

  document.getElementById('lb-cap').textContent=t; lb.hidden=false; tone([1175],.05); document.getElementById('lb-close').focus(); }

document.getElementById('lb-close').addEventListener('click',closeLB);

function selectMail(){const r=document.createRange();r.selectNodeContents(document.getElementById('mail'));const s=getSelection();s.removeAllRanges();s.addRange(r)}

/* ---------- teclado y enlaces ---------- */
function moveVert(i,dir){
  const r0=tiles[i].getBoundingClientRect(); let best=i,bd=1e9;
  order.forEach(k=>{const r=tiles[k].getBoundingClientRect(); const dy=(r.top-r0.top)*dir;
    if(dy>5){const d=dy*1000+Math.abs(r.left-r0.left); if(d<bd){bd=d;best=k}}});
  return best;
}
document.addEventListener('keydown',e=>{
  if(!tv.hidden){ if(e.key==='Escape'){e.preventDefault();closeTV()} return; }
  if(!lb.hidden){ if(e.key==='Escape'){e.preventDefault();closeLB()} return; }
  if(!screen.hidden){
    if(e.key==='Escape'){e.preventDefault();closeItem()}
    else if(e.key==='ArrowRight') step(1); else if(e.key==='ArrowLeft') step(-1);
    return;
  }
  if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key)){
    e.preventDefault();
    let p=Math.max(0,order.indexOf(sel)); let i=order[p];
    if(sel<0) i=order[0];
    else if(e.key==='ArrowRight') i=order[(p+1)%order.length];
    else if(e.key==='ArrowLeft') i=order[(p-1+order.length)%order.length];
    else i=moveVert(sel,e.key==='ArrowDown'?1:-1);
    select(i,{focus:true});
  } else if(e.key==='Enter' && e.target===document.body && sel>=0){ openItem(sel,true); }
});
function fromHash(){
  if(selfHash) return; const h=decodeURIComponent(location.hash.slice(1)); const i=ITEMS.findIndex(it=>it.id===h);
  if(i>=0 && screen.hidden){ if(tiles[i]) select(i,{sound:false}); openItem(i,false); }
  else if(i>=0 && i!==current){ step(i-current); }
  else if(!h && !screen.hidden){ closeItem(); }
}
addEventListener('hashchange',fromHash);
fromHash();
})();
</script>
